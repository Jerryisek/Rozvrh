<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktivní Rozvrh VŠB-TUO</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        [v-cloak] { display: none; }
        .timetable-scroll { overflow-x: auto; padding-bottom: 1rem; }
        .timetable-grid {
            display: grid;
            grid-template-columns: repeat(14, minmax(65px, 1fr));
            gap: 4px;
            min-width: 1000px;
        }
        .day-row {
            display: flex;
            border-bottom: 1px solid #e5e7eb;
        }
        .day-label {
            flex: 0 0 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            background-color: #f3f4f6;
            text-transform: uppercase;
            font-size: 0.75rem;
            border-right: 1px solid #e5e7eb;
        }
        .day-content {
            flex: 1;
            padding: 8px;
            position: relative;
        }
        .time-header {
            display: flex;
            padding-left: 80px;
            background-color: #e5e7eb;
            border-bottom: 2px solid #d1d5db;
        }
        .time-header-content {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(14, minmax(65px, 1fr));
            gap: 4px;
            min-width: 1000px;
        }
        .time-slot {
            font-size: 0.7rem;
            text-align: center;
            font-weight: 600;
            padding: 4px 0;
            color: #4b5563;
        }
        /* Zajištění správného vertikálního skládání bloků */
        .block-card { grid-row: auto; }
    </style>
</head>
<body class="bg-gray-50 p-4 md:p-6 font-sans text-gray-800">

<div id="app" v-cloak class="max-w-[1400px] mx-auto">
    <h1 class="text-2xl md:text-3xl font-bold mb-6 text-gray-900 border-b-2 border-gray-300 pb-2">Architekt rozvrhu FEI</h1>

    <div class="flex flex-col lg:flex-row gap-6">
        
        <!-- Levý panel -->
        <div class="lg:w-72 flex flex-col gap-4 shrink-0">
            <div class="bg-white p-4 rounded shadow">
                <h2 class="text-lg font-bold mb-2 border-b pb-1">Možnosti předmětů</h2>
                <p class="text-xs text-gray-600 mb-4 font-medium leading-snug">
                    1. Zaškrtni pro zobrazení všech možných termínů.<br>
                    2. Kliknutím v rozvrhu ukotvi vybraný termín.<br>
                    3. Odškrtni - zůstane vidět pouze tvá finální volba.
                </p>
                <div class="flex flex-col gap-2">
                    <label v-for="subject in subjects" :key="subject.id" class="flex items-center gap-2 p-2 border rounded cursor-pointer hover:bg-gray-50 transition-colors">
                        <input type="checkbox" v-model="subject.showOptions" class="w-4 h-4 text-blue-600 rounded">
                        <input type="color" v-model="subject.color" class="w-5 h-5 p-0 border-0 rounded cursor-pointer shrink-0">
                        <span class="text-sm font-semibold leading-tight select-none truncate" :class="{ 'opacity-50': !subject.showOptions }">
                            {{ subject.name }}
                        </span>
                    </label>
                </div>
                
                <button @click="clearAllSelections" class="mt-6 w-full bg-red-100 text-red-700 hover:bg-red-200 text-sm font-bold py-2 px-4 rounded transition">
                    Smazat můj rozvrh (Reset)
                </button>
            </div>
        </div>

        <!-- Mřížka rozvrhu -->
        <div class="flex-1 bg-white rounded shadow overflow-hidden">
            <div class="timetable-scroll">
                
                <!-- Časová osa -->
                <div class="time-header">
                    <div class="time-header-content">
                        <div v-for="time in timeBlocks" :key="time" class="time-slot">{{ time }}</div>
                    </div>
                </div>

                <!-- Dny -->
                <div v-for="day in days" :key="day" class="day-row">
                    <div class="day-label">{{ day }}</div>
                    <div class="day-content timetable-grid">
                        
                        <!-- Pozadí (Mřížka) -->
                        <div v-for="n in 14" :key="n" class="border-l border-gray-100 min-h-[65px]" :style="{ gridColumn: n, gridRow: '1 / -1' }"></div>
                        
                        <!-- Bloky předmětů -->
                        <div v-for="block in getVisibleBlocks(day)" :key="block.id"
                             @click="toggleBlock(block.id)"
                             class="block-card relative border-2 rounded p-1 cursor-pointer transition-all z-10 flex flex-col justify-center overflow-hidden shadow-sm hover:scale-[1.03]"
                             :style="{
                                gridColumn: `${block.startIdx + 1} / span ${block.endIdx - block.startIdx + 1}`,
                                backgroundColor: block.selected ? getSubjectConfig(block.subjectId).color : '#ffffff',
                                borderColor: getSubjectConfig(block.subjectId).color,
                                color: block.selected ? getContrastYIQ(getSubjectConfig(block.subjectId).color) : '#1f2937',
                                opacity: block.selected ? '1' : '0.6'
                             }"
                             :class="{ 
                                'border-dashed': !block.selected, 
                                'shadow-md ring-2 ring-gray-800 ring-offset-1 z-20': block.selected
                             }">
                             
                            <div class="font-bold text-[10px] md:text-xs truncate leading-tight">
                                {{ getSubjectConfig(block.subjectId).shortName }}
                            </div>
                            <div class="text-[9px] md:text-[10px] mt-0.5 font-bold leading-tight" :class="{'opacity-90': block.selected, 'text-gray-600': !block.selected}">
                                {{ block.type }} | {{ block.room }}
                            </div>
                            
                            <!-- Checkmark indikátor -->
                            <div v-if="block.selected" class="absolute top-1 right-1 font-bold text-xs">✓</div>
                        </div>

                    </div>
                </div>
                
            </div>
        </div>

    </div>
</div>

<script>
    const { createApp, ref } = Vue;

    createApp({
        setup() {
            const timeBlocks = [
                "7:15", "8:00", "9:00", "9:45", 
                "10:45", "11:30", "12:30", "13:15", 
                "14:15", "15:00", "16:00", "16:45", 
                "17:45", "18:30"
            ];
            const days = ["pondělí", "úterý", "středa", "čtvrtek", "pátek"];

            // Konfigurace předmětů - defaultně zapnuté zobrazení možností
            const subjects = ref([
                { id: 1, name: "Výroba a užití el. energie", shortName: "Výroba el.", color: "#3b82f6", showOptions: true },
                { id: 2, name: "Jazyk anglický III pro FEI", shortName: "Angličtina", color: "#ef4444", showOptions: true },
                { id: 3, name: "Soft Skills I", shortName: "Soft Skills", color: "#10b981", showOptions: true },
                { id: 4, name: "Fyzika I", shortName: "Fyzika I", color: "#f59e0b", showOptions: true },
                { id: 5, name: "Matematická analýza 2", shortName: "Matika 2", color: "#8b5cf6", showOptions: true },
                { id: 6, name: "Vybrané kap. z el. strojů", shortName: "El. stroje", color: "#ec4899", showOptions: true },
                { id: 7, name: "Technická dokumentace", shortName: "Tech. dok.", color: "#14b8a6", showOptions: true },
                { id: 8, name: "Technické vybavení budov", shortName: "Tech. budov", color: "#f97316", showOptions: true }
            ]);

            let blockId = 0;
            const createBlock = (subId, day, start, end, type, room) => ({
                id: blockId++, subjectId: subId, day, startIdx: start, endIdx: end, type, room, selected: false
            });

            // Přesná extrakce bloků z dodaných rozvrhů
            const allBlocks = ref([
                // Výroba
                createBlock(1, "pondělí", 6, 7, "Přednáška", "P/01"),
                createBlock(1, "pondělí", 8, 9, "Cvičení", "C/01"),
                // Angličtina
                createBlock(2, "pondělí", 4, 5, "Cvičení", "C/03"),
                createBlock(2, "úterý", 2, 3, "Cvičení", "C/02"),
                createBlock(2, "úterý", 4, 5, "Cvičení", "C/01"),
                createBlock(2, "středa", 2, 3, "Cvičení", "C/04"),
                // Soft Skills (Rozsáhlé varianty)
                createBlock(3, "pondělí", 8, 8, "Cvičení", "C/10"),
                createBlock(3, "pondělí", 10, 10, "Cvičení", "C/01"),
                createBlock(3, "pondělí", 12, 12, "Cvičení", "C/08"),
                createBlock(3, "úterý", 4, 4, "Cvičení", "C/05"),
                createBlock(3, "úterý", 6, 6, "Cvičení", "C/12"),
                createBlock(3, "úterý", 8, 8, "Cvičení", "C/13"),
                createBlock(3, "středa", 0, 0, "Cvičení", "C/02"),
                createBlock(3, "středa", 2, 2, "Cvičení", "C/03"),
                createBlock(3, "středa", 4, 4, "Cvičení", "C/14"),
                createBlock(3, "středa", 6, 6, "Cvičení", "C/06"),
                createBlock(3, "čtvrtek", 4, 4, "Cvičení", "C/04"),
                createBlock(3, "čtvrtek", 8, 8, "Cvičení", "C/07"),
                createBlock(3, "čtvrtek", 10, 10, "Cvičení", "C/11"),
                createBlock(3, "pátek", 0, 0, "Cvičení", "C/09"),
                // Fyzika I
                createBlock(4, "pondělí", 2, 3, "Přednáška", "P/03"),
                createBlock(4, "pondělí", 4, 5, "Cvičení", "C/04"),
                createBlock(4, "pondělí", 6, 7, "Lab", "L/04"),
                createBlock(4, "pondělí", 8, 9, "Lab", "L/05"),
                createBlock(4, "úterý", 0, 1, "Cvičení", "C/06"),
                createBlock(4, "úterý", 2, 3, "Přednáška", "P/05"),
                createBlock(4, "úterý", 4, 5, "Lab", "L/10"),
                createBlock(4, "úterý", 6, 7, "Lab", "L/07"),
                createBlock(4, "úterý", 8, 9, "Lab", "L/08"),
                createBlock(4, "středa", 4, 5, "Lab", "L/12"),
                createBlock(4, "středa", 6, 7, "Přednáška", "P/01"),
                createBlock(4, "středa", 8, 9, "Cvičení", "C/01"),
                createBlock(4, "čtvrtek", 2, 3, "Cvičení", "C/05"),
                createBlock(4, "čtvrtek", 4, 5, "Cvičení", "C/03"),
                createBlock(4, "čtvrtek", 6, 7, "Cvičení", "C/02"),
                createBlock(4, "čtvrtek", 8, 9, "Lab", "L/06"),
                createBlock(4, "čtvrtek", 10, 11, "Lab", "L/03"),
                // Matika 2
                createBlock(5, "pondělí", 5, 6, "Přednáška", "P/02"),
                createBlock(5, "pondělí", 7, 8, "Cvičení", "C/03"),
                createBlock(5, "pondělí", 9, 10, "Cvičení", "C/04"),
                createBlock(5, "úterý", 1, 2, "Cvičení", "C/02"),
                createBlock(5, "úterý", 5, 6, "Přednáška", "P/01"),
                createBlock(5, "úterý", 7, 8, "Cvičení", "C/05"),
                createBlock(5, "středa", 5, 6, "Cvičení", "C/06"),
                createBlock(5, "středa", 7, 8, "Cvičení", "C/01"),
                createBlock(5, "čtvrtek", 3, 4, "Cvičení", "C/07"),
                createBlock(5, "čtvrtek", 8, 9, "Cvičení", "C/08"),
                // El. stroje
                createBlock(6, "čtvrtek", 0, 1, "Přednáška", "P/01"),
                createBlock(6, "čtvrtek", 3, 4, "Cvičení", "C/01"),
                // Tech. dokumentace
                createBlock(7, "úterý", 10, 11, "Přednáška", "P/01"),
                createBlock(7, "čtvrtek", 0, 1, "Cvičení", "C/07"),
                createBlock(7, "čtvrtek", 2, 3, "Cvičení", "C/06"),
                createBlock(7, "čtvrtek", 5, 6, "Cvičení", "C/02"),
                createBlock(7, "čtvrtek", 7, 8, "Cvičení", "C/03"),
                createBlock(7, "čtvrtek", 10, 11, "Cvičení", "C/08"),
                // Tech. vybavení budov
                createBlock(8, "úterý", 4, 5, "Přednáška", "P/01"),
                createBlock(8, "čtvrtek", 4, 5, "Cvičení", "C/01"),
                createBlock(8, "čtvrtek", 7, 8, "Cvičení", "C/02")
            ]);

            const getSubjectConfig = (id) => subjects.value.find(s => s.id === id);

            // Jádro logiky: Zobrazit blok pokud je VYBRÁN, nebo pokud má předmět aktivní režim MOŽNOSTÍ
            const getVisibleBlocks = (dayName) => {
                return allBlocks.value.filter(block => {
                    if (block.day !== dayName) return false;
                    const subject = getSubjectConfig(block.subjectId);
                    return subject.showOptions || block.selected;
                });
            };

            // Přímá mutace zdrojového objektu = okamžitá reaktivita ve Vue 3
            const toggleBlock = (blockId) => {
                const block = allBlocks.value.find(b => b.id === blockId);
                if (block) {
                    block.selected = !block.selected;
                }
            };

            const clearAllSelections = () => {
                allBlocks.value.forEach(b => b.selected = false);
            };

            const getContrastYIQ = (hexcolor) => {
                hexcolor = hexcolor.replace("#", "");
                var r = parseInt(hexcolor.substr(0,2),16);
                var g = parseInt(hexcolor.substr(2,2),16);
                var b = parseInt(hexcolor.substr(4,2),16);
                var yiq = ((r*299)+(g*587)+(b*114))/1000;
                return (yiq >= 128) ? '#000000' : '#ffffff';
            };

            return {
                timeBlocks, days, subjects, getVisibleBlocks, getSubjectConfig, toggleBlock, clearAllSelections, getContrastYIQ
            };
        }
    }).mount('#app');
</script>
</body>
</html>
